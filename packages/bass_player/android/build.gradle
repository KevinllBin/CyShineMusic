plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

group = 'com.cyshine.bass_player'
version = '0.1.0'

android {
    namespace = 'com.cyshine.bass_player'
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    implementation project(':basslib')
}
