plugins {
    id 'com.android.library'
}

group = 'com.cyshine.music_home_widget'
version = '0.1.0'

android {
    namespace = 'com.cyshine.music_home_widget'
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    implementation project(':audio_service')
}
