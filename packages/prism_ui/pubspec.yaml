name: prism_ui
description: A distinctive iOS-style UI library for Flutter, with liquid glass, fluid motion and rich color themes built from a single color.
version: 0.1.2
repository: https://github.com/chen08209/prism_ui
issue_tracker: https://github.com/chen08209/prism_ui/issues
topics:
  - ui
  - widgets
  - design-system

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  path_parsing: ^1.1.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1

flutter:
  shaders:
    - shaders/liquid_glass.frag
    - shaders/ink_sparkle.frag
