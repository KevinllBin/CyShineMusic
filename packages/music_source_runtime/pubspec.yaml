publish_to: none

environment:
  sdk: ^3.11.4
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.cyshine.music_source_runtime
        pluginClass: MusicSourceRuntimePlugin


